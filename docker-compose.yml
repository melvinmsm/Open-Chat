services:

  backend:
    build:
      context: ./backend

    container_name: opsllm-backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    restart: unless-stopped


  open-webui:
    image: ghcr.io/open-webui/open-webui:main

    container_name: opsllm-open-webui

    ports:
      - "3000:8080"

    volumes:
      - open-webui-data:/app/backend/data

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  open-webui-data: 
